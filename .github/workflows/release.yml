# Builds Kizuna-Setup.exe (PyInstaller app + Inno Setup installer) on GitHub's Windows machines.
# Run it from the Actions tab ("Run workflow"), or push a version tag (git tag v1.0.0; git push origin v1.0.0):
# a tag also publishes a GitHub Release with the installer attached.
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Kizuna.exe
        run: python -m PyInstaller installer/kizuna.spec --noconfirm --distpath dist --workpath build

      - name: Build Kizuna-Setup.exe
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          iscc installer\kizuna.iss "/DMyAppVersion=$version"

      - uses: actions/upload-artifact@v4
        with:
          name: Kizuna-Setup
          path: dist/Kizuna-Setup.exe

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kizuna-Setup.exe
          generate_release_notes: true
