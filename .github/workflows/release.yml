# Builds Kizuna for Windows on GitHub's machines and attaches it to a release:
#   Kizuna-Setup.exe      the installer (recommended)
#   Kizuna-win-x64.zip    the same app without installing: unzip anywhere, run Kizuna.exe
# Publish a release on GitHub (Releases -> Draft a new release -> new tag like v1.0.0 -> Generate release notes ->
# Publish) and this attaches both files a few minutes later. "Run workflow" on the Actions tab builds a test copy
# (downloadable under the run's Artifacts) without publishing anything.
name: Build installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Kizuna.exe
        run: python -m PyInstaller installer/kizuna.spec --noconfirm --distpath dist --workpath build

      - name: Build Kizuna-Setup.exe and the portable zip
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $env:Path += ";C:\Program Files (x86)\Inno Setup 6" }
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          iscc installer\kizuna.iss "/DMyAppVersion=$version"
          Compress-Archive -Path dist\Kizuna -DestinationPath dist\Kizuna-win-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: Kizuna-Setup
          path: |
            dist/Kizuna-Setup.exe
            dist/Kizuna-win-x64.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/Kizuna-Setup.exe
            dist/Kizuna-win-x64.zip
