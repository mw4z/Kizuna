<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="k-token" content="__STREMIO_TOKEN__">
<meta name="referrer" content="no-referrer">
<title>News · Kizuna</title><link rel="icon" type="image/png" href="/app.png"><link rel="stylesheet" href="/kizuna.css">
<style>
.n-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.n-tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--k-line-strong);border-radius:999px}
.n-tabs button{border:0;background:none;color:var(--k-text-2);font:500 13px var(--k-font);height:30px;padding:0 14px;border-radius:999px;cursor:pointer}
.n-tabs button[aria-pressed=true]{background:var(--k-raised);color:var(--k-text);box-shadow:inset 0 0 0 1px var(--k-line-strong)}
.n-status{display:flex;align-items:center;gap:12px;margin-top:10px}
.fresh{display:none;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;border:0;cursor:pointer;
  background:var(--k-accent);color:var(--k-accent-ink);font:600 12.5px var(--k-font);animation:k-in .3s var(--k-ease)}
.fresh.show{display:inline-flex}
/* lead story + top stories */
.lead-wrap{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:28px;margin-top:26px}
.lead{position:relative;display:block;border-radius:12px;overflow:hidden;min-height:420px;background:#141418;text-decoration:none;color:#fff;isolation:isolate}
.lead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--k-ease),opacity .6s;opacity:0}
.lead img.in{opacity:1}
.lead:hover img{transform:scale(1.03)}
.lead .slide{position:absolute;inset:0;display:block;color:#fff;text-decoration:none;isolation:isolate;transform:translateX(100%);visibility:hidden;will-change:transform}
.lead .slide.on{transform:none;visibility:visible}
.lead .slide.anim{transition:transform .75s cubic-bezier(.65,0,.35,1);visibility:visible}
.lead .dots{position:absolute;bottom:16px;inset-inline-start:30px;display:flex;gap:6px;z-index:2}
.lead .dots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.35);transition:width .3s var(--k-ease),background .3s}
.lead .dots button[aria-current=true]{width:24px;background:#fff}
.lead .dots button:focus-visible,.lead .nav:focus-visible{outline:2px solid var(--k-accent);outline-offset:3px}
.lead .nav{all:unset;position:absolute;bottom:8px;z-index:2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(8,8,10,.55);color:#fff;opacity:0;transition:opacity .2s}
.lead:hover .nav,.lead .nav:focus-visible{opacity:1}
@media (hover:none){.lead .nav{opacity:1}}
.lead .nav.prev{inset-inline-end:58px}.lead .nav.next{inset-inline-end:20px}
.lead .nav svg{width:18px;height:18px}[dir=rtl] .lead .nav svg{transform:scaleX(-1)}
.lead .slide::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,10,0) 30%,rgba(8,8,10,.55) 58%,rgba(8,8,10,.96) 100%),
  linear-gradient(90deg,rgba(8,8,10,.55),rgba(8,8,10,0) 60%)}
.lead-body{position:absolute;left:0;right:0;bottom:0;padding:28px 30px 44px}
.lead h2{font:650 30px/1.15 var(--k-font-display);letter-spacing:-.015em;margin:10px 0 10px;max-width:30ch;text-wrap:balance}
.lead p{margin:0;color:rgba(255,255,255,.78);max-width:60ch;font-size:14px;line-height:1.55}
.kicker{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.72)}
.kicker .k-tag{background:var(--k-accent);color:#fff}
.kicker .k-tag.screen{background:#2b4c8f}
.kicker .k-tag.lang{background:rgba(255,255,255,.16);color:rgba(255,255,255,.85)}
.side{display:grid;gap:0;align-content:start}
.side a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--k-line);text-decoration:none;color:inherit}
.side a:first-child{padding-top:0}.side a:last-child{border-bottom:0}
.side .thumb{aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--k-raised);position:relative}
.side .thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.side .thumb img.in{opacity:1}
.side h3{font:600 14px/1.35 var(--k-font-display);margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.side a:hover h3,.card:hover h3{color:var(--k-text-hi);text-decoration:underline;text-decoration-color:var(--k-line-hover);text-underline-offset:3px}
.meta{font-size:12px;color:var(--k-text-3)}
.meta b{font-weight:600;color:var(--k-text-2)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 24px}
.card{display:block;text-decoration:none;color:inherit}
.card .thumb{position:relative;aspect-ratio:16/9;border-radius:var(--k-r-art);overflow:hidden;background:var(--k-raised);margin-bottom:12px}
.card .thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform .6s var(--k-ease)}.card .thumb img.in{opacity:1}
.card:hover .thumb img{transform:scale(1.04)}
.card h3{font:600 15px/1.35 var(--k-font-display);margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0 0 8px;color:var(--k-text-2);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* text tile for stories without a picture */
.tile{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(200,54,79,.30),transparent 55%),linear-gradient(160deg,#1c1a21,#121116)}
.tile.screen{background:radial-gradient(120% 140% at 0% 0%,rgba(84,124,214,.30),transparent 55%),linear-gradient(160deg,#181b22,#111318)}
.tile .src{font:700 11px/1 var(--k-font-display);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.tile .seal{align-self:flex-end;font:600 40px/1 "Yu Gothic UI","Meiryo UI",sans-serif;color:rgba(255,255,255,.07)}
.side .tile{padding:8px}.side .tile .src{font-size:9px;letter-spacing:.1em}.side .tile .seal{font-size:22px}
.sk{border-radius:var(--k-r-art)}
[dir=rtl] .lead .slide::after{background:linear-gradient(180deg,rgba(8,8,10,0) 30%,rgba(8,8,10,.55) 58%,rgba(8,8,10,.96) 100%),linear-gradient(270deg,rgba(8,8,10,.55),rgba(8,8,10,0) 60%)}
[dir=rtl] .tile .src{letter-spacing:0;text-transform:none;font-size:12px}
.lang{background:var(--k-fill-2);color:var(--k-text-2)}
@media (max-width:980px){.lead-wrap{grid-template-columns:1fr}.lead{min-height:340px}.lead h2{font-size:25px}}
@media (max-width:600px){.lead-body{padding:20px}.lead h2{font-size:21px}.side a{grid-template-columns:84px minmax(0,1fr)}}
</style></head><body>
<header class="k-top"></header>
<main class="k-page">
<div class="n-head"><div><h1 class="k-title">News</h1>
 <p class="k-lede">The latest from anime, film and television, refreshed every few minutes while this page is open.</p></div>
 <div class="n-tabs" role="group" aria-label="Section"><button type="button" data-kind="all" aria-pressed="true">Everything</button>
  <button type="button" data-kind="anime" aria-pressed="false">Anime</button><button type="button" data-kind="screen" aria-pressed="false">Movies &amp; TV</button></div></div>
<div class="n-status"><span class="k-meta" id="updated" aria-live="polite">Loading the latest stories…</span>
 <button type="button" class="fresh" id="fresh"></button></div>
<div class="lead-wrap" id="top"><div class="lead k-sk" style="min-height:420px"></div><div class="side">
 <div class="k-sk" style="height:84px;margin-bottom:14px"></div><div class="k-sk" style="height:84px;margin-bottom:14px"></div><div class="k-sk" style="height:84px"></div></div></div>
<section class="k-section" aria-labelledby="hMore"><div class="k-section-head"><h2 class="k-h" id="hMore">More stories</h2><span class="k-meta" id="sources"></span></div>
 <div class="grid" id="grid"></div></section>
</main>
<script src="/kizuna-ar.js"></script><script src="/kizuna.js"></script>
<script>
const $=id=>document.getElementById(id),K=Kizuna,esc=K.esc;
K.shell('news');
let kind='all',shown=[],pending=null;
const KIND={anime:'Anime',screen:'Movies & TV'};
const ago=at=>at?K.ago(Date.now()/1000-at):'';
const pic=(n,cls)=>n.image?`<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
  :`<div class="tile ${n.kind}"><span class="src">${esc(n.source)}</span><span class="seal" aria-hidden="true">絆</span></div>`;
const link=n=>`href="${esc(n.link)}" target="_blank" rel="noopener noreferrer"`;
// a story's own direction: Arabic and translated ones read right-to-left even when they start with an English name
const dir=n=>`dir="${n.lang==='ar'||n.translated?'rtl':'ltr'}"`;
const other=n=>K.lang==='ar'&&n.lang!=='ar'?` · <span class="k-tag lang">${K.t(n.translated?'Machine-translated':'English')}</span>`:'';
// the banner: up to 5 top stories with pictures (anime and film mixed in "Everything"), one every 7 seconds
let slideAt=0,slideTimer=null;
function pickSlides(items){const pics=items.filter(n=>n.image);
  if(kind!=='all')return pics.slice(0,5);
  const a=pics.filter(n=>n.kind==='anime'),s=pics.filter(n=>n.kind==='screen'),out=[];
  for(let i=0;out.length<5&&(i<a.length||i<s.length);i++){if(a[i])out.push(a[i]);if(s[i]&&out.length<5)out.push(s[i])}
  return out}
// slide (not fade): the outgoing story moves out while the next moves in, in reading direction
function slide(i,dir){const lead=document.querySelector('.lead'),all=[...document.querySelectorAll('.lead .slide')];if(!all.length)return;
  const n=all.length,next=(i+n)%n,cur=all[slideAt]||all[0],nxt=all[next];
  if(lead.dataset.ready&&next!==slideAt&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const s=(dir||(next>slideAt?1:-1))*(document.documentElement.dir==='rtl'?-1:1);
    all.forEach(x=>{if(x!==cur&&x!==nxt){x.classList.remove('anim');x.style.transform='';x.style.visibility=''}});
    nxt.classList.remove('anim');nxt.style.transform=`translateX(${s*100}%)`;nxt.style.visibility='visible';void nxt.offsetWidth;
    nxt.classList.add('anim');cur.classList.add('anim');nxt.style.transform='translateX(0)';cur.style.transform=`translateX(${-s*100}%)`;
    const settle=e=>{if(e.target!==cur)return;cur.removeEventListener('transitionend',settle);
      if(!cur.classList.contains('on')){cur.classList.remove('anim');cur.style.transform='';cur.style.visibility=''}nxt.classList.remove('anim')};
    cur.addEventListener('transitionend',settle)}
  else all.forEach(x=>{x.classList.remove('anim');x.style.transform='';x.style.visibility=''});
  lead.dataset.ready='1';slideAt=next;
  all.forEach((x,j)=>{const on=j===slideAt;x.classList.toggle('on',on);x.tabIndex=on?0:-1;x.setAttribute('aria-hidden',String(!on))});
  document.querySelectorAll('.lead .dots button').forEach((b,j)=>b.setAttribute('aria-current',String(j===slideAt)))}
function play(){clearInterval(slideTimer);
  slideTimer=setInterval(()=>{const l=document.querySelector('.lead');if(!document.hidden&&l&&!l.matches(':hover,:focus-within'))slide(slideAt+1,1)},7000)}
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const ARROW_NEXT=ARROW.replace('M15 6l-6 6 6 6','M9 6l6 6-6 6');
function render(items){
  shown=items;const slides=pickSlides(items);if(!slides.length&&items[0])slides.push(items[0]);const lead=slides[0];
  if(!lead){$('top').innerHTML='<div class="k-empty" style="grid-column:1/-1"><strong>No stories right now</strong>The news sites did not answer. Kizuna keeps trying.</div>';$('grid').innerHTML='';return}
  const rest=items.filter(n=>!slides.includes(n)),mix=kind==='all'?[0,1].flatMap(i=>[rest.filter(n=>n.kind==='anime')[i],rest.filter(n=>n.kind==='screen')[i]]).filter(Boolean):[],side=(mix.length===4?mix:rest.slice(0,4)),more=rest.filter(n=>!side.includes(n));
  $('top').innerHTML=`<div class="lead" role="region" aria-roledescription="carousel" aria-label="Top stories">${slides.map((n,j)=>`<a class="slide" ${link(n)}>${n.image?`<img src="${esc(n.image)}" alt="" ${j?'loading="lazy" ':''}referrerpolicy="no-referrer">`:''}
    <div class="lead-body"><div class="kicker"><span class="k-tag ${n.kind}">${KIND[n.kind]}</span><span>${esc(n.source)} · ${esc(ago(n.at))}</span>${other(n)}</div>
    <h2><bdi ${dir(n)}>${esc(n.title)}</bdi></h2>${n.summary?`<p ${dir(n)}>${esc(n.summary)}</p>`:''}</div></a>`).join('')}
    ${slides.length>1?`<button type="button" class="nav prev" aria-label="Previous story">${ARROW}</button><button type="button" class="nav next" aria-label="Next story">${ARROW_NEXT}</button>
    <div class="dots">${slides.map((n,j)=>`<button type="button" aria-label="Story ${j+1}"></button>`).join('')}</div>`:''}</div>
    <div class="side">${side.map(n=>`<a ${link(n)}><div class="thumb">${pic(n)}</div><div><h3><bdi ${dir(n)}>${esc(n.title)}</bdi></h3><div class="meta"><b>${esc(n.source)}</b> · ${esc(ago(n.at))}${other(n)}</div></div></a>`).join('')}</div>`;
  slideAt=0;slide(0);play();
  const top=$('top').querySelector('.lead');
  top.querySelectorAll('.dots button').forEach((b,j)=>b.onclick=()=>{slide(j);play()});
  top.querySelector('.prev')?.addEventListener('click',()=>{slide(slideAt-1,-1);play()});
  top.querySelector('.next')?.addEventListener('click',()=>{slide(slideAt+1,1);play()});
  $('grid').innerHTML=more.map(n=>`<a class="card" ${link(n)}><div class="thumb">${pic(n)}</div><h3><bdi ${dir(n)}>${esc(n.title)}</bdi></h3>${n.summary?`<p ${dir(n)}>${esc(n.summary)}</p>`:''}
    <div class="meta"><b>${esc(n.source)}</b> · ${esc(ago(n.at))}${other(n)}</div></a>`).join('');
}
let ticket=0;
async function load(fresh){
  const mine=++ticket,want=kind;
  let d;try{d=await K.api('news?kind='+want)}catch(e){if(mine===ticket)$('updated').textContent=e.message;return}
  if(mine!==ticket||want!==kind)return;               // a newer request or another tab took over
  $('updated').textContent=`Updated ${K.ago(Date.now()/1000-d.updated)}`+(d.failed.length?` · ${d.failed.join(', ')} not answering`:'');
  $('sources').textContent=d.sources.filter(s=>kind==='all'||s.kind===kind).map(s=>s.name).join(' · ');
  if(!fresh||!shown.length){render(d.items);return}
  const known=new Set(shown.map(n=>n.link)),added=d.items.filter(n=>!known.has(n.link));
  if(added.length){pending=d.items;$('fresh').textContent=`${added.length} new ${added.length===1?'story':'stories'} · show`;$('fresh').classList.add('show')}
}
$('fresh').onclick=()=>{if(pending)render(pending);pending=null;$('fresh').classList.remove('show');window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};
document.querySelector('.n-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.kind===kind)return;kind=b.dataset.kind;
  document.querySelectorAll('.n-tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));shown=[];pending=null;$('fresh').classList.remove('show');load(false)});
load(false);setInterval(()=>load(true),60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
</script></body></html>
